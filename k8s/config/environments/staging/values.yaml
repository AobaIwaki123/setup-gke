# Staging Environment Configuration
# Environment-specific values for staging deployment

# Cluster configuration
cluster:
  name: "staging-gke-cluster"
  location: "us-central1"
  environment: "staging"
  
# Node pool configuration
nodePool:
  system:
    machineType: "e2-standard-2"
    diskSizeGb: 100
    minNodes: 1
    maxNodes: 3
  application:
    machineType: "e2-standard-4"
    diskSizeGb: 100
    minNodes: 2
    maxNodes: 8

# ArgoCD configuration
argocd:
  domain: "argocd-staging.example.com"
  replicas: 2
  resources:
    limits:
      cpu: "1000m"
      memory: "2Gi"
    requests:
      cpu: "200m"
      memory: "512Mi"

# Cloudflare configuration
cloudflare:
  domain: "staging.example.com"
  zoneId: "staging-zone-id"
  
# Monitoring configuration
monitoring:
  prometheus:
    retention: "15d"
    storage: "30Gi"
    replicas: 1
  grafana:
    storage: "8Gi"
  alertmanager:
    storage: "3Gi"

# Storage configuration
storage:
  defaultClass: "balanced-ssd"
  
# Security configuration
security:
  networkPolicies: true
  podSecurityStandards: "restricted"