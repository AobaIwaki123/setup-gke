# Kustomization Template
# Base template for environment-specific customizations

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base resources (common across all environments)
resources:
- ../../cluster/cluster.yaml
- ../../cluster/node-pools.yaml
- ../../cluster/storage-classes.yaml
- ../../argocd/namespace.yaml
- ../../argocd/install.yaml
- ../../argocd/rbac.yaml
- ../../cloudflare-ingress/namespace.yaml
- ../../cloudflare-ingress/deployment.yaml
- ../../cloudflare-ingress/rbac.yaml
- ../../monitoring/namespace.yaml
- ../../monitoring/prometheus/deployment.yaml
- ../../monitoring/prometheus/config.yaml
- ../../monitoring/grafana/deployment.yaml
- ../../monitoring/alertmanager/deployment.yaml
- ../../ingress/argocd-ingress.yaml

# Common labels applied to all resources
commonLabels:
  managed-by: kustomize
  
# Namespace for resources that don't specify one
namespace: default

# Images to be replaced (example)
images:
- name: prom/prometheus
  newTag: v2.45.0
- name: grafana/grafana
  newTag: 10.0.0
- name: prom/alertmanager
  newTag: v0.25.0

# ConfigMap generator (example)
configMapGenerator:
- name: environment-config
  files:
  - config.yaml

# Secret generator (example)
secretGenerator:
- name: environment-secrets
  files:
  - secrets.yaml
  type: Opaque

# Patches for environment-specific modifications
patches:
- target:
    kind: Deployment
    name: prometheus
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1