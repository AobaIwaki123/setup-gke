# Cloudflare Ingress Controller Deployment
# Based on requirements 3.1, 3.2, 3.3 from the requirements document

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ingress-controller
  namespace: cloudflare-ingress
  labels:
    app.kubernetes.io/name: cloudflare-ingress-controller
    app.kubernetes.io/component: controller
spec:
  replicas: 2  # High availability setup
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-ingress-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-ingress-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: cloudflare-ingress-controller
      
      # Node selector for system workloads
      nodeSelector:
        node-type: system
      
      # Toleration for system node pool
      tolerations:
      - key: "system-workload"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      
      containers:
      - name: controller
        image: cloudflare/cloudflare-ingress-controller:latest  # Replace with specific version
        imagePullPolicy: IfNotPresent
        
        # Environment variables for Cloudflare API
        env:
        - name: CF_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-api-credentials
              key: api-token
        - name: CF_ZONE_ID
          valueFrom:
            secretKeyRef:
              name: cloudflare-api-credentials
              key: zone-id
        
        # Resource limits and requests
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        
        # Ports
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: webhook
          containerPort: 9443
          protocol: TCP
        
        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: webhook-certs
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
      
      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      - name: webhook-certs
        secret:
          secretName: cloudflare-ingress-controller-webhook-certs
          optional: true
      
      # Security context for pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000

---
# Service for the controller
apiVersion: v1
kind: Service
metadata:
  name: cloudflare-ingress-controller
  namespace: cloudflare-ingress
  labels:
    app.kubernetes.io/name: cloudflare-ingress-controller
    app.kubernetes.io/component: controller
spec:
  selector:
    app.kubernetes.io/name: cloudflare-ingress-controller
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP
  - name: webhook
    port: 9443
    targetPort: webhook
    protocol: TCP