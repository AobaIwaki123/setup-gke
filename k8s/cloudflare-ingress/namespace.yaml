# Cloudflare Ingress Controller Namespace
# Based on requirements 3.1, 3.2 from the requirements document

apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare-ingress
  labels:
    name: cloudflare-ingress
    component: ingress-controller
    managed-by: kubernetes
  annotations:
    description: "Namespace for Cloudflare Ingress Controller"