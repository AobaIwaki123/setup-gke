# Storage Classes for different performance requirements
# Based on requirement 1.5 from the requirements document

---
# Standard SSD storage class for general purpose workloads
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-ssd
  labels:
    performance: high
provisioner: kubernetes.io/gce-pd
parameters:
  type: pd-ssd
  replication-type: regional-pd
  zones: us-central1-a,us-central1-b,us-central1-c
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete

---
# High-performance SSD storage class for databases and critical workloads
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ultra-ssd
  labels:
    performance: ultra
provisioner: kubernetes.io/gce-pd
parameters:
  type: pd-extreme
  provisioned-iops-on-create: "10000"
  replication-type: regional-pd
  zones: us-central1-a,us-central1-b,us-central1-c
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete

---
# Standard HDD storage class for backup and archival
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: standard-hdd
  labels:
    performance: standard
provisioner: kubernetes.io/gce-pd
parameters:
  type: pd-standard
  replication-type: regional-pd
  zones: us-central1-a,us-central1-b,us-central1-c
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete

---
# Balanced storage class (default) for most workloads
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: balanced-ssd
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  labels:
    performance: balanced
provisioner: kubernetes.io/gce-pd
parameters:
  type: pd-balanced
  replication-type: regional-pd
  zones: us-central1-a,us-central1-b,us-central1-c
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete