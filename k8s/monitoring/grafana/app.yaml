# Grafana の ArgoCD Application 設定
# Prometheus メトリクスの可視化とダッシュボードを提供
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  # ArgoCD プロジェクト設定
  project: default
  
  # 複数のソースを指定（Helm Chart と追加マニフェスト）
  sources:
    # 1. Helm チャートのソース設定
    - repoURL: https://grafana.github.io/helm-charts
      chart: grafana
      targetRevision: 10.1.4  # 使用する Helm チャートのバージョン
    # 2. Git リポジトリから追加マニフェスト（Ingress）を読み込む
    - repoURL: https://github.com/AobaIwaki123/setup-gke.git
      targetRevision: task-1
      path: k8s/monitoring/grafana/manifests

  # デプロイ先の設定
  destination:
    server: https://kubernetes.default.svc  # ローカル Kubernetes クラスター
    namespace: monitoring
  
  # 自動同期の設定
  syncPolicy:
    automated:
      prune: true     # 不要なリソースを自動削除
      selfHeal: true  # ドリフトを自動修正
    syncOptions:
      - CreateNamespace=true    # Namespace が存在しない場合は自動作成
      - ServerSideApply=true   # Server-side apply を使用してリソースの競合を回避