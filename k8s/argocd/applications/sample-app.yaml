# Sample ArgoCD Application
# This is a template for ArgoCD application definitions
# Based on requirements 2.3, 2.4 from the requirements document

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app
  namespace: argocd
  labels:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Project configuration
  project: default
  
  # Source repository configuration
  source:
    repoURL: https://github.com/example/app-manifests  # Replace with actual repository
    targetRevision: HEAD
    path: manifests
    
    # Helm configuration (if using Helm charts)
    # helm:
    #   valueFiles:
    #   - values.yaml
    #   parameters:
    #   - name: image.tag
    #     value: latest
  
  # Destination cluster and namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  
  # Sync policy configuration
  syncPolicy:
    automated:
      prune: true      # Remove resources not defined in Git
      selfHeal: true   # Automatically sync when cluster state differs from Git
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    
    # Retry configuration
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # Revision history limit
  revisionHistoryLimit: 10
  
  # Ignore differences for certain fields
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas